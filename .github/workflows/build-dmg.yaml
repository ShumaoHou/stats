name: Build & Package DMG

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Test quick action popup layout
        run: python3 Kit/scripts/run-quick-actions-tests.py

      - name: Build and Archive
        run: |
          xcodebuild \
            -scheme Stats \
            -destination 'platform=macOS' \
            -configuration Release \
            archive \
            -archivePath build/Stats.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package DMG
        run: |
          mkdir -p build/export
          cp -R build/Stats.xcarchive/Products/Applications/Stats.app build/export/Stats.app
          ln -s /Applications build/export/Applications
          hdiutil create -volname "Stats" -srcfolder build/export -ov -format UDZO build/Stats.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stats.dmg
          path: build/Stats.dmg
